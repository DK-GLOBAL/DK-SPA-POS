<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DK SPA POS – Barber, Salon & Spa Manager</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef1ef;--sf:#fff;--tx:#17211f;--mu:#68756f;--bd:#dce2df;--sb:#0f2f2b;--sbt:#cfe0da;--ac:#e8731c;--tl:#0e8a96;--ok:#1f7a4f;--bad:#b3392f;--warn:#a8741a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a17;--sf:#16251f;--tx:#e8efec;--mu:#93a59d;--bd:#26382f;--sb:#0a1512;--ok:#4cc38a;--bad:#ef7a6f;--warn:#e0b56a}}
:root[data-theme="dark"]{--bg:#0f1a17;--sf:#16251f;--tx:#e8efec;--mu:#93a59d;--bd:#26382f;--sb:#0a1512;--ok:#4cc38a;--bad:#ef7a6f;--warn:#e0b56a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'DM Sans',system-ui,sans-serif;display:flex;min-height:100vh}
h1,h2,h3,.num{font-family:Fraunces,Georgia,serif}
nav{width:215px;background:var(--sb);color:var(--sbt);padding:16px 12px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;flex-shrink:0;overflow:auto}
nav .logo{display:flex;gap:8px;align-items:center;padding:2px 6px 14px;color:#fff}nav .logo b{font:700 16px Fraunces,serif;line-height:1.1}nav .logo small{display:block;font:400 11px 'DM Sans';color:var(--sbt)}
nav button{background:none;border:0;color:inherit;text-align:left;padding:9px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button:hover{background:rgba(255,255,255,.08)}nav button.on{background:var(--ac);color:#1a1405;font-weight:700}
nav .ft{margin-top:auto;font-size:12px;padding:8px 6px;display:flex;flex-direction:column;gap:6px}nav .ft select,nav .ft input{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:6px;padding:4px;font:inherit;width:100%}nav .ft option{color:#000}
.pw{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sbt)}.pw img{width:26px;height:26px;border-radius:5px;background:#fff}
main{flex:1;padding:24px;min-width:0;max-width:1100px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}h1{margin:0;font-size:27px}
.btn{background:var(--ac);color:#1a1405;border:0;padding:9px 16px;border-radius:8px;font:700 14px 'DM Sans',sans-serif;cursor:pointer}
.btn.g{background:transparent;border:1px solid var(--bd);color:var(--tx);font-weight:500}.btn.s{padding:4px 10px;font-size:12px}.btn.d{background:transparent;color:var(--bad);border:1px solid var(--bd)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:13px 15px}.kpi small{color:var(--mu)}.kpi .num{font-size:24px;display:block}
.pan{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:14px}.pan h2{margin:0 0 10px;font-size:18px}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--mu);font-weight:500;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}td{padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}
.bdg{padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid currentColor}.booked,.open,.low{color:var(--warn)}.completed,.done,.active,.ok{color:var(--ok)}.cancelled,.suspended,.bad,.void{color:var(--bad)}
.bars{display:flex;gap:10px;align-items:flex-end;height:130px}.bars div{flex:1;text-align:center;font-size:12px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.bars b{display:block;background:var(--ac);border-radius:5px 5px 0 0;min-height:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.empty{color:var(--mu);padding:12px 0}
.car{background:var(--sb);color:#fff;border-radius:10px;padding:18px 20px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:84px}
.car p{margin:0;font:600 18px Fraunces,serif}.car i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff5;margin-left:5px;cursor:pointer}.car i.on{background:var(--ac)}
pre{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:12px;overflow:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
#md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}#md.on{display:flex}
#md form{background:var(--sf);border-radius:12px;padding:20px;width:100%;max-width:400px;max-height:90vh;overflow:auto}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
label.ck{display:flex;gap:8px;align-items:center;color:var(--tx);margin:4px 0}label.ck input{width:auto}input[type=color]{padding:2px;height:38px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.err{color:var(--bad);font-size:13px;margin-top:8px}
/* public screens */
#lg{position:fixed;inset:0;display:none;overflow:auto;z-index:10;background:#0a0d14;color:#fff}#lg.on{display:block}
.sk{background:linear-gradient(#090c13,#2a0f1d 62%,#7a2238);position:relative;overflow:hidden}.sk svg.city{position:absolute;bottom:0;left:0;width:100%;height:38%;opacity:.55}
.ld header{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;position:relative;z-index:2}.lgo{display:flex;align-items:center;gap:10px;font:700 20px Fraunces,serif}.lgo i{font-style:normal;color:var(--ac)}
.hero{text-align:center;padding:30px 20px 90px;position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px}.hero h1{font-size:clamp(32px,6vw,56px);line-height:1.05;max-width:760px}.hero p{max-width:560px;color:#d8c9d0;margin:0}.hero small{color:#c9b8c0}
.btn.lgb{padding:13px 30px;font-size:16px;background:var(--tl);color:#fff}
.sec{padding:40px 20px;text-align:center;max-width:1050px;margin:0 auto}.sec h2{font-size:28px;margin:0 0 6px}.sec>p{color:#a9b4b8;margin:0 0 22px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.cd{background:#141a24;border:1px solid #232c3a;border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center}.cd svg{width:100%;max-width:230px;height:auto}.cd h3{margin:8px 0 2px}.cd p{margin:0;color:#a9b4b8;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.chips span{border:1px solid #2f3a4b;border-radius:99px;padding:6px 14px;font-size:14px;color:#d6dde0}
.mq{overflow:hidden;border-top:1px solid #232c3a;border-bottom:1px solid #232c3a;padding:18px 0}.mq div{display:flex;gap:56px;width:max-content;align-items:center;animation:mq 26s linear infinite}.mq img{height:38px;width:auto}
@keyframes mq{to{transform:translateX(-50%)}}@media(prefers-reduced-motion:reduce){.mq div{animation:none}.mq{overflow:auto}}
.ld footer{text-align:center;padding:26px;color:#a9b4b8;font-size:13px;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}.ld footer img{width:30px;height:30px;border-radius:6px;background:#fff}
.lw{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px 16px;position:relative}.lw>*{position:relative;z-index:2}
.lc{width:100%;max-width:420px;background:#fff;color:#111;border-radius:6px;overflow:hidden}.lc h2{margin:0;background:#050505;color:#fff;text-align:center;padding:18px;font-size:22px}
.lc form{padding:20px 22px}.lc label{color:#111;font-weight:700;font-size:13px;margin:12px 0 4px}.lc label b{color:#d22;margin-right:4px}.lc input{background:#fff;color:#111;border:1px solid #ccd}.lc label.ck{font-weight:700}
.pwr{display:flex}.pwr input{border-radius:8px 0 0 8px}.pwr button{border:1px solid #ccd;border-left:0;background:#f1f3f5;border-radius:0 8px 8px 0;padding:0 12px;cursor:pointer}
.lb{width:100%;background:var(--tl);color:#fff;border:0;padding:11px;border-radius:8px;font:500 16px 'DM Sans';cursor:pointer;margin-top:14px}.lc a{display:inline-block;margin-top:12px;color:#0a58ca;cursor:pointer;font-size:14px}
.lc .lf{background:#050505;color:#fff;text-align:center;font-size:12px;padding:10px;display:flex;gap:6px;justify-content:center;align-items:center}.lc .lf img{width:22px;height:22px;border-radius:4px;background:#fff}
.bk{max-width:560px;margin:0 auto;background:#141a24;border:1px solid #232c3a;border-radius:14px;padding:18px;text-align:left}.bk input,.bk select{background:#0d121a;color:#fff;border-color:#2f3a4b}#bf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}#bf select{grid-column:1/-1}.as{display:flex;gap:8px}.ar{color:#d6dde0;min-height:22px;margin:8px 0 0}#bo{margin-top:12px;text-align:center}
@media(max-width:760px){body{flex-direction:column}nav{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:8px}nav .logo,nav .ft{display:none}nav button{white-space:nowrap}main{padding:14px}.grid2{grid-template-columns:1fr}}
</style></head><body>

function stk(){const c=D.mp,o=$('so');let p=$('sp').value.replace(/\D/g,'');if(p[0]==='0')p='254'+p.slice(1);else if(/^[17]\d{8}$/.test(p))p='254'+p;
 const a=Math.round(+$('sa').value),miss=!c.ck||!c.cs||!c.sc||!c.pk||!c.cb||(c.tt==='CustomerBuyGoodsOnline'&&!c.till);o.style.display='block';

 const d=new Date(),z=n=>String(n).padStart(2,'0'),ts=''+d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+z(d.getHours())+z(d.getMinutes())+z(d.getSeconds()),base=c.env==='production'?'https://api.safaricom.co.ke':'https://sandbox.safaricom.co.ke';
 const body={BusinessShortCode:c.sc,Password:btoa(c.sc+c.pk+ts),Timestamp:ts,TransactionType:c.tt,Amount:a,PartyA:p,PartyB:c.tt==='CustomerBuyGoodsOnline'?c.till:c.sc,PhoneNumber:p,CallBackURL:c.cb,AccountReference:$('sr').value||c.ar,TransactionDesc:c.td};
 o.textContent=`1) GET ${base}/oauth/v1/generate?grant_type=client_credentials\n   Authorization: Basic base64(consumerKey:consumerSecret)\n\n2) POST ${base}/mpesa/stkpush/v1/processrequest\n   Authorization: Bearer <access_token>\n${JSON.stringify(body,null,2)}\n\n3) Safaricom sends the result to your callback URL. ResultCode 0 = paid; copy the MpesaReceiptNumber and click “Record M-Pesa payment”.`;lg('STK request built for '+m(a))}
