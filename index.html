<title>DK SPA POS – Barber, Salon & Spa Manager</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef1ef;--sf:#fff;--tx:#17211f;--mu:#68756f;--bd:#dce2df;--sb:#0f2f2b;--sbt:#cfe0da;--ac:#e8731c;--tl:#0e8a96;--ok:#1f7a4f;--bad:#b3392f;--warn:#a8741a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a17;--sf:#16251f;--tx:#e8efec;--mu:#93a59d;--bd:#26382f;--sb:#0a1512;--ok:#4cc38a;--bad:#ef7a6f;--warn:#e0b56a}}
:root[data-theme="dark"]{--bg:#0f1a17;--sf:#16251f;--tx:#e8efec;--mu:#93a59d;--bd:#26382f;--sb:#0a1512;--ok:#4cc38a;--bad:#ef7a6f;--warn:#e0b56a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'DM Sans',system-ui,sans-serif;display:flex;min-height:100vh}
h1,h2,h3,.num{font-family:Fraunces,Georgia,serif}
nav{width:215px;background:var(--sb);color:var(--sbt);padding:16px 12px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;flex-shrink:0;overflow:auto}
nav .logo{display:flex;gap:8px;align-items:center;padding:2px 6px 14px;color:#fff}nav .logo b{font:700 16px Fraunces,serif;line-height:1.1}nav .logo small{display:block;font:400 11px 'DM Sans';color:var(--sbt)}
nav button{background:none;border:0;color:inherit;text-align:left;padding:9px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button:hover{background:rgba(255,255,255,.08)}nav button.on{background:var(--ac);color:#1a1405;font-weight:700}
nav .ft{margin-top:auto;font-size:12px;padding:8px 6px;display:flex;flex-direction:column;gap:6px}nav .ft select,nav .ft input{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:6px;padding:4px;font:inherit;width:100%}nav .ft option{color:#000}
.pw{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sbt)}.pw img{width:26px;height:26px;border-radius:5px;background:#fff}
main{flex:1;padding:24px;min-width:0;max-width:1100px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}h1{margin:0;font-size:27px}
.btn{background:var(--ac);color:#1a1405;border:0;padding:9px 16px;border-radius:8px;font:700 14px 'DM Sans',sans-serif;cursor:pointer}
.btn.g{background:transparent;border:1px solid var(--bd);color:var(--tx);font-weight:500}.btn.s{padding:4px 10px;font-size:12px}.btn.d{background:transparent;color:var(--bad);border:1px solid var(--bd)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:13px 15px}.kpi small{color:var(--mu)}.kpi .num{font-size:24px;display:block}
.pan{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:14px}.pan h2{margin:0 0 10px;font-size:18px}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--mu);font-weight:500;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}td{padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}
.bdg{padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid currentColor}.booked,.open,.low{color:var(--warn)}.completed,.done,.active,.ok{color:var(--ok)}.cancelled,.suspended,.bad,.void{color:var(--bad)}
.bars{display:flex;gap:10px;align-items:flex-end;height:130px}.bars div{flex:1;text-align:center;font-size:12px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.bars b{display:block;background:var(--ac);border-radius:5px 5px 0 0;min-height:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.empty{color:var(--mu);padding:12px 0}
.car{background:var(--sb);color:#fff;border-radius:10px;padding:18px 20px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:84px}
.car p{margin:0;font:600 18px Fraunces,serif}.car i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff5;margin-left:5px;cursor:pointer}.car i.on{background:var(--ac)}
pre{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:12px;overflow:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
#md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}#md.on{display:flex}
#md form{background:var(--sf);border-radius:12px;padding:20px;width:100%;max-width:400px;max-height:90vh;overflow:auto}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
label.ck{display:flex;gap:8px;align-items:center;color:var(--tx);margin:4px 0}label.ck input{width:auto}input[type=color]{padding:2px;height:38px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.err{color:var(--bad);font-size:13px;margin-top:8px}
/* public screens */
#lg{position:fixed;inset:0;display:none;overflow:auto;z-index:10;background:#0a0d14;color:#fff}#lg.on{display:block}
.sk{background:linear-gradient(#090c13,#2a0f1d 62%,#7a2238);position:relative;overflow:hidden}.sk svg.city{position:absolute;bottom:0;left:0;width:100%;height:38%;opacity:.55}
.ld header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:14px 22px;position:relative;z-index:2}.ld header>div{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}.ld header>div>*{margin:0!important}.ld .lgo{white-space:nowrap;font-size:24px}@media(max-width:640px){.ld header{justify-content:center}.ld header>div{justify-content:center}}.lgo{display:flex;align-items:center;gap:10px;font:700 20px Fraunces,serif}.lgo i{font-style:normal;color:var(--ac)}
.hero{text-align:center;padding:30px 20px 90px;position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px}.hero h1{font-size:clamp(32px,6vw,56px);line-height:1.05;max-width:760px}.hero p{max-width:560px;color:#d8c9d0;margin:0}.hero small{color:#c9b8c0}
.btn.lgb{padding:13px 30px;font-size:16px;background:var(--tl);color:#fff}
.sec{padding:40px 20px;text-align:center;max-width:1050px;margin:0 auto}.sec h2{font-size:28px;margin:0 0 6px}.sec>p{color:#a9b4b8;margin:0 0 22px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.cd{background:#141a24;border:1px solid #232c3a;border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center}.cd svg{width:100%;max-width:230px;height:auto}.cd h3{margin:8px 0 2px}.cd p{margin:0;color:#a9b4b8;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.chips span{border:1px solid #2f3a4b;border-radius:99px;padding:6px 14px;font-size:14px;color:#d6dde0}
.mq{overflow:hidden;border-top:1px solid #232c3a;border-bottom:1px solid #232c3a;padding:18px 0}.mq div{display:flex;gap:56px;width:max-content;align-items:center;animation:mq 26s linear infinite}.mq img{height:38px;width:auto}
@keyframes mq{to{transform:translateX(-50%)}}@media(prefers-reduced-motion:reduce){.mq div{animation:none}.mq{overflow:auto}}
.ld footer{text-align:center;padding:26px;color:#a9b4b8;font-size:13px;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}.ld footer img{width:30px;height:30px;border-radius:6px;background:#fff}
.lw{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px 16px;position:relative}.lw>*{position:relative;z-index:2}
.lc{width:100%;max-width:420px;background:#fff;color:#111;border-radius:6px;overflow:hidden}.lc h2{margin:0;background:#050505;color:#fff;text-align:center;padding:18px;font-size:22px}
.lc form{padding:20px 22px}.lc label{color:#111;font-weight:700;font-size:13px;margin:12px 0 4px}.lc label b{color:#d22;margin-right:4px}.lc input{background:#fff;color:#111;border:1px solid #ccd}.lc label.ck{font-weight:700}
.pwr{display:flex}.pwr input{border-radius:8px 0 0 8px}.pwr button{border:1px solid #ccd;border-left:0;background:#f1f3f5;border-radius:0 8px 8px 0;padding:0 12px;cursor:pointer}
.lb{width:100%;background:var(--tl);color:#fff;border:0;padding:11px;border-radius:8px;font:500 16px 'DM Sans';cursor:pointer;margin-top:14px}.lc a{display:inline-block;margin-top:12px;color:#0a58ca;cursor:pointer;font-size:14px}
.lc .lf{background:#050505;color:#fff;text-align:center;font-size:12px;padding:10px;display:flex;gap:6px;justify-content:center;align-items:center}.lc .lf img{width:22px;height:22px;border-radius:4px;background:#fff}
.bk{max-width:560px;margin:0 auto;background:#141a24;border:1px solid #232c3a;border-radius:14px;padding:18px;text-align:left}.bk input,.bk select{background:#0d121a;color:#fff;border-color:#2f3a4b}#bf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}#bf select{grid-column:1/-1}.as{display:flex;gap:8px}.ar{color:#d6dde0;min-height:22px;margin:8px 0 0}#bo{margin-top:12px;text-align:center}
@media(max-width:760px){body{flex-direction:column}nav{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:8px}nav .logo,nav .ft{display:none}nav button{white-space:nowrap}main{padding:14px}.grid2{grid-template-columns:1fr}}

.pan{overflow-x:auto}body.pr>nav,body.pr>main,body.pr>#lg{display:none!important}body.pr #md{position:static;background:none;padding:0;display:block}body.pr #md form{box-shadow:none;max-width:none;width:auto;padding:0}@media print{.noprint{display:none!important}}

.rtabs{display:flex;gap:4px;margin:0 0 14px;flex-wrap:wrap;border-bottom:1px solid var(--bd)}
.rtabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 16px;font:600 14px 'DM Sans',sans-serif;color:var(--mu);cursor:pointer;margin-bottom:-1px}
.rtabs button.on{color:var(--tx);border-bottom-color:var(--ac)}.rtabs button:hover{color:var(--tx)}
.kpi .sub{display:block;font-size:12px;color:var(--mu);margin-top:2px}
.rp h2{border-left:4px solid var(--ac);padding-left:10px}.rp th{text-transform:uppercase;font-size:11.5px;letter-spacing:.04em}.rp tr:nth-child(even) td{background:rgba(127,127,127,.06)}
.mb{height:8px;min-width:90px;background:var(--bg);border-radius:99px;overflow:hidden}.mb i{display:block;height:100%;background:linear-gradient(90deg,var(--tl),var(--ac));border-radius:99px}
.tbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tbar select,.top select,.top input{width:auto}
.phd{display:none}.phl{display:flex;gap:12px;align-items:center}.phl b{font:700 20px Fraunces,serif;display:block}.phl span,.phr span{display:block;font-size:12px;color:var(--mu)}.phr{text-align:right}.phr h2{margin:0;font:700 22px Fraunces,serif;color:var(--ac)}
@media print{html:has(body.pm){background:#fff}body.pm{--bg:#fff;--sf:#fff;--tx:#111;--mu:#555;--bd:#d5dbd8;--ok:#1f7a4f;--bad:#b3392f;--warn:#a8741a;background:#fff;color:#111;display:block;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body.pm nav,body.pm #md,body.pm #lg,body.pm main>.top,body.pm .rtabs,body.pm .noprint,body.pm main select,body.pm main input,body.pm main .btn,body.pm .car{display:none!important}
body.pm main{padding:0;max-width:none}body.pm .phd{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:3px solid var(--ac);padding-bottom:12px;margin-bottom:16px}
body.pm .kpi{break-inside:avoid}body.pm tr{break-inside:avoid}body.pm .wrap{overflow:visible}body.pm td,body.pm th{white-space:normal}}

#ai{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;font:14px/1.45 'DM Sans',system-ui,sans-serif}
.aib{display:flex;gap:8px;align-items:center;background:var(--ac);color:#1a1405;border:0;border-radius:99px;padding:12px 18px;font:700 14px 'DM Sans',sans-serif;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.aip{width:min(360px,calc(100vw - 24px));height:min(520px,calc(100vh - 100px));background:#fff;color:#17211f;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden}
.aih{background:var(--sb);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}.aih small{display:block;opacity:.75;font-size:11px}.aih button{background:none;border:0;color:#fff;font-size:16px;cursor:pointer}
.aim{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#f4f6f5}
.ab,.au{max-width:85%;padding:8px 12px;border-radius:14px;overflow-wrap:anywhere}.ab{background:#fff;border:1px solid #dce2df;align-self:flex-start}.au{background:var(--ac);color:#1a1405;align-self:flex-end}.ab a{color:#0e8a96;font-weight:700}
.aic{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px 0;background:#f4f6f5}.aic button{border:1px solid var(--ac);background:#fff;color:#17211f;border-radius:99px;padding:5px 12px;font:500 13px 'DM Sans',sans-serif;cursor:pointer}
.aif{display:flex;gap:8px;padding:10px;background:#f4f6f5}.aif input{background:#fff;color:#17211f}
@media print{#ai{display:none!important}}

html{-webkit-text-size-adjust:100%;text-size-adjust:100%}body{overscroll-behavior-y:none}
nav{padding-top:max(16px,env(safe-area-inset-top));padding-left:max(12px,env(safe-area-inset-left))}
@media(pointer:coarse){.btn,nav button,.rtabs button,.aic button{min-height:44px}input,select,textarea{font-size:16px!important;min-height:44px}}
@media(max-width:760px){nav{padding-top:max(8px,env(safe-area-inset-top))}main{padding-bottom:calc(14px + env(safe-area-inset-bottom))}.pan{overflow-x:auto}.kpis{grid-template-columns:repeat(2,1fr)!important}#md form,#md>div{max-width:100vw!important;width:100%!important;max-height:100vh!important;border-radius:0!important}.phr{text-align:left}}
@media(max-width:420px){.kpis{grid-template-columns:1fr!important}.top{flex-wrap:wrap;gap:8px}}
#inst{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:35;background:#17211f;color:#fff;border:0;border-radius:99px;padding:11px 16px;font:700 13px 'DM Sans',sans-serif;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.3);display:none}
@media(display-mode:standalone){#inst{display:none!important}}
@media print{#inst{display:none!important}}

#ldr{position:fixed;inset:0;display:grid;place-items:center;background:#0f1a17;z-index:95}.spin{width:44px;height:44px;border:4px solid #ffffff33;border-top-color:#e8731c;border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.bell{position:relative;background:none;border:0;font-size:20px;color:#fff;cursor:pointer;align-self:flex-start;margin:0 0 6px 4px;padding:4px 8px}.bell span{position:absolute;top:-2px;right:-4px;background:#e53935;color:#fff;border-radius:99px;font:700 11px 'DM Sans',sans-serif;padding:1px 6px}
.tst{position:fixed;top:16px;right:16px;z-index:96;background:#17211f;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.4);font:14px 'DM Sans',sans-serif;max-width:min(360px,calc(100vw - 32px))}
body.cloud #book{display:none}
</style></head><body>

 if(need&&!DIRTY&&!uiBusy()){const x=await cLoadNow();if(x.data&&!DIRTY)render()}}finally{POLLING=false}}
/* session */
function cAfter(){if(!cur||!TOK)return;if(cur.role==='platform'&&view==='spas'&&Date.now()-TCT>(/^live:/.test(snapSel)?5000:20000)&&!TCF){TCF=true;API('viewAll',{},TOK).then(r=>{TCF=false;if(r.tenants){TC=r.tenants;TCT=Date.now();if(view==='spas'&&!uiBusy())render()}})}}
async function cEnter(tok,v0){loader();const r=await API('load',{},tok);const l=$('ldr');if(l)l.remove();if(!r.data){const er=$('lerr');if(er)er.textContent=r.err||'Could not load your data.';return}
 if(r.mc){cForce(tok);return}
 TOK=tok;lsSet('dkspa_tok',tok);cApply(r);cur=D.users.find(x=>x.id===r.uid);if(!cur){TOK='';lsSet('dkspa_tok','');return}
 view=v0||'dash';idle();BOOT=false;cPollStart();if(!v0)lg('Login');render();if(!v0)setTimeout(welcome,300);if(cur.role==='platform'&&!MFAON)setTimeout(()=>cMfa(true),100)}
function cForce(tok){form('Choose a new password',[{k:'n',l:'New password (8+ characters, letters and numbers)',t:'password'},{k:'c',l:'Confirm new password',t:'password'}],v=>{const e=pwOk(v.n,v.c,null);if(e)return e;(async()=>{const r=await API('chpw',{n:v.n,forced:true},tok);if(r.token)cEnter(r.token);else{alert(r.err||'Could not change the password.');scr='login';render()}})()})}
async function cLogout(){const t=TOK;loader();clearInterval(POLLT);clearTimeout(PT);if(DIRTY||PUSHING)await cPushNow(t);TOK='';lsSet('dkspa_tok','');lsSet('dkspa_sess','');try{sessionStorage.setItem('dkspa_scr',scr==='login'?'login':'land')}catch(e){}location.reload()}
function cExpire(){TOK='';lsSet('dkspa_tok','');lsSet('dkspa_sess','');try{sessionStorage.setItem('dkspa_scr','login')}catch(e){}alert('Your session has ended. Please log in again.');location.reload()}
async function cLogoutAll(){if(!confirm('Sign out of every device, including this one?'))return;await cPushNow(TOK);await API('logoutAll',{},TOK);TOK='';lsSet('dkspa_tok','');lsSet('dkspa_sess','');location.reload()}
async function cBoot(){
 if(DEMO){restoreSess();BOOT=false;render();return}
 loader();const p=await API('ping',{});const l=$('ldr');if(l)l.remove();
 try{if(sessionStorage.getItem('dkspa_scr')==='login'){scr='login';sessionStorage.removeItem('dkspa_scr')}}catch(e){}
 if(p.code===200&&p.ok){CLOUD=true;SETUP=!!p.setup;document.body.classList.add('cloud');
  const t=lsGet('dkspa_tok');if(t&&!SETUP){let s=null;try{s=JSON.parse(lsGet('dkspa_sess')||'null')}catch(e){}loader();const r=await API('load',{},t);const l2=$('ldr');if(l2)l2.remove();
   if(r.data&&!r.mc){const role=(r.data.users.find(x=>x.id===r.uid)||{}).role,lim=(role==='platform'||role==='manager')?18e5:72e5;if(s&&Date.now()-s.ts<lim){cEnter(t,s.v||'dash');return}}lsSet('dkspa_tok','')}
  BOOT=false;render();return}
 if(p.code===404||!/^https?:$/.test(location.protocol)||['localhost','127.0.0.1'].includes(location.hostname)){restoreSess();BOOT=false;render();return}
 document.body.insertAdjacentHTML('beforeend','<div id="ldr" style="color:#fff;font:16px DM Sans,sans-serif;text-align:center;padding:24px"><div><p><b>Cannot reach the server.</b></p><p>Check your internet connection, then try again.</p><button class="btn" onclick="location.reload()">Try again</button></div></div>')}
/* login */
let CNT;function cCount(sec){const er=$('lerr'),b=document.querySelector('#lf .lb');clearInterval(CNT);let n=+sec||60;const f=()=>{if(!$('lerr')){clearInterval(CNT);return}if(n<=0){clearInterval(CNT);er.textContent='';if(b)b.disabled=false;return}er.textContent='Too many attempts. Try again in '+Math.floor(n/60)+':'+String(n%60).padStart(2,'0');if(b)b.disabled=true;n--};f();CNT=setInterval(f,1000)}
async function cLogin(){const em=$('le').value.trim().toLowerCase(),pw=$('lp').value,er=$('lerr'),b=document.querySelector('#lf .lb');er.style.color='';lsSet('dkspa_rem',$('lr').checked?em:'');
 if(!em||!pw){er.textContent='Enter your email and password.';return}
 if(SETUP)return cSetupForm(em,pw);
 b.disabled=true;er.textContent='';const r=await API('login',{email:em,pw});b.disabled=false;
 if(r.code===429)return cCount(r.retryAfterSeconds);
 if(r.mfa)return cMfaStep(r.ticket);
 if(!r.token){er.textContent=(r.err||'Login failed.')+(r.attemptsLeft!=null&&r.attemptsLeft<=3?' ('+r.attemptsLeft+' tries left)':'');return}
 cEnter(r.token)}
function cMfaStep(ticket){$('lf').innerHTML=`<p style="margin:0 0 10px">Enter the 6-digit code from your authenticator app, or one of your recovery codes.</p><input id="lm" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" style="font-size:20px;letter-spacing:4px;text-align:center"><div class="err" id="lerr"></div><button class="lb">Verify</button><a onclick="render()" style="display:block;text-align:center;margin-top:12px">← Back</a>`;$('lm').focus();
 $('lf').onsubmit=async e=>{e.preventDefault();const r=await API('mfa',{ticket,code:$('lm').value});if(r.code===429)return cCount(r.retryAfterSeconds);if(!r.token){$('lerr').textContent=(r.err||'Wrong code.')+(r.attemptsLeft!=null?' ('+r.attemptsLeft+' tries left)':'');return}cEnter(r.token)}}
function cSetupForm(em,pw){form('First-time platform setup',[{k:'e',l:'Admin email',t:'email',v:em},{k:'code',l:'Setup code (ADMIN_SETUP_CODE in Vercel)',t:'password'},{k:'n',l:'New admin password',t:'password',v:pw},{k:'c',l:'Confirm password',t:'password'}],v=>{const e=pwOk(v.n,v.c,null);if(e)return e;if(!v.code)return 'Enter the setup code.';cDoSetup(v)})}
async function cDoSetup(v){loader();const T={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('dkspa_t_'))T[k.slice(8)]=JSON.parse(localStorage.getItem(k))}}catch(e){}
 const r=await API('setup',{email:v.e,code:v.code,pw:v.n,data:JSON.parse(JSON.stringify(D)),tenants:T});const l=$('ldr');if(l)l.remove();
 if(r.code===429)return alert('Too many attempts. Try again in '+Math.ceil((r.retryAfterSeconds||60)/60)+' minute(s).');if(!r.ok)return alert(r.err||'Setup failed.');
 SETUP=false;try{const bak={master:JSON.parse(JSON.stringify(D)),tenants:T};(bak.master.users||[]).forEach(u=>delete u.pw);(bak.master.reqs||[]).forEach(q=>delete q.pw);Object.values(bak.tenants).forEach(t=>(t.users||[]).forEach(u=>delete u.pw));localStorage.setItem('dkspa_premigrate',JSON.stringify(bak));localStorage.removeItem(K);Object.keys(T).forEach(id=>localStorage.removeItem('dkspa_t_'+id))}catch(e){}
 const x=await API('login',{email:v.e,pw:v.n});if(x.token)cEnter(x.token);else{scr='login';render()}}
async function cSignup(q,er){er.textContent='';const r=await API('signup',q);if(r.code===429){er.textContent='Too many sign-ups from this network. Try again in '+Math.ceil((r.retryAfterSeconds||60)/60)+' minute(s).';return}if(!r.ok){er.textContent=r.err||'Could not send your request.';return}
 $('sf').innerHTML='<p style="padding:8px 0">Thank you! DK Global Tech has been notified and will review your request, then share the agreement and pricing on WhatsApp. You can log in once approved.</p>'+(ADMIN_WA?`<a class="btn" style="text-decoration:none;display:block;text-align:center;margin-bottom:10px" target="_blank" rel="noopener" href="https://wa.me/${ADMIN_WA}?text=${encodeURIComponent('New DK SPA POS account request: '+q.spa+', '+q.owner+', '+q.phone)}">Also tell DK Global Tech on WhatsApp</a>`:'')+'<a onclick="scr=\'land\';render()">← Home</a>'}
/* admin actions */
async function cAppr(id){const q=D.reqs.find(x=>x.id===id);if(q.agr!=='signed')return alert('Share the agreement and mark it signed first.');await cPushNow(TOK);const r=await API('approve',{id},TOK);if(r.err)return alert(r.err);await cLoadNow();lg('Account approved: '+q.spa+' (separate data created)');render()}
async function cMk(q,ld){await cPushNow(TOK);const r=await API('mkT',q,TOK);if(r.err)return alert(r.err);await cLoadNow();if(ld&&ld.id){const l=(D.leads||[]).find(x=>x.id===ld.id);if(l){l.stage='Won';l.cid=r.tid}}lg('Client created: '+q.spa);save();render();shareLogin(r.tid,q.pw)}
async function cCred(b,ok){const r=await API('credSet',b,TOK);if(r.err)return alert(r.err);ok()}
function cCredDel(email){API('credDel',{email},TOK)}
async function cReset(id){const r0=D.tenants.find(x=>x.id===id);if(!confirm('Create a new temporary password for '+r0.spa+'’s manager? They must choose their own at next login, and their two-step login is reset.'))return;const tmp=genPw();await cCred({email:r0.email,pw:tmp,mc:1,mfaReset:true,tid:id},()=>{lg('Manager login reset: '+r0.spa);save();render();setTimeout(()=>shareLogin(id,tmp),80)})}
async function cResetPw(u){if(!confirm('Reset the password for '+u.name+'?'))return;const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789',tmp='Spa-'+Array.from(crypto.getRandomValues(new Uint32Array(6)),x=>A[x%A.length]).join('')+'7';await cCred({email:u.email,pw:tmp,mc:1,mfaReset:true},()=>{lg('Password reset for '+u.name);save();mdShow(`<h2 style="margin:0;font-family:Fraunces,serif">Temporary password</h2><p>Give this to <b>${esc(u.name)}</b> in person or by a private message. They must choose their own password when they sign in.</p><p style="font:700 22px monospace;letter-spacing:1px;margin:12px 0">${tmp}</p><p class="empty">This is the only time it is shown.</p><div class="row"><button type="button" class="btn" onclick="cm()">Done</button></div>`)})}
function cChPw(){form('Change password',[{k:'o',l:'Current password',t:'password'},{k:'n',l:'New password (8+ characters, letters and numbers)',t:'password'},{k:'c',l:'Confirm new password',t:'password'}],v=>{const e=pwOk(v.n,v.c,null);if(e)return e;(async()=>{const r=await API('chpw',{o:v.o,n:v.n},TOK);if(r.token){TOK=r.token;lsSet('dkspa_tok',r.token);lg('Password changed');toast('Password changed')}else alert(r.err||'Could not change the password.')})()})}
/* forgot password */
async function cOtpReq(){const g=$('fmsg');g.style.color='#1f7a4d';const r=await API('otpReq',{email:$('fe').value.trim()});if(r.code===429){g.style.color='#b3392f';g.textContent='Too many requests. Try again in '+Math.ceil((r.retryAfterSeconds||60)/60)+' minute(s).';return}g.textContent='If this email belongs to a staff or reception account, your manager can now see a 6-digit code. Ask them for it and enter it below. It works for 10 minutes.'}
async function cUseOtp(){const g=$('fmsg');g.style.color='#b3392f';const n=$('fsp').value,e=pwOk(n,n,null);if(e)return g.textContent=e;const r=await API('otpUse',{email:$('fe').value.trim(),code:$('fo').value.trim(),pw:n});if(!r.ok)return g.textContent=r.err||'That code is not valid.';scr='login';render();$('lerr').style.color='#1f7a4d';$('lerr').textContent='Password updated. Please sign in.'}
async function cRecover(){const er=$('ferr'),n=$('fnp').value,e=pwOk(n,n,null);if(e)return er.textContent=e;const r=await API('recover',{email:$('fe').value.trim(),code:$('frc').value.trim(),pw:n});if(!r.ok)return er.textContent=r.err||'The email or code is not correct.';scr='login';render();$('lerr').style.color='#1f7a4d';$('lerr').textContent='Password updated. Two-step login was reset. Please sign in.'}
/* notifications bell */
const cBell=()=>{const n=(D.notifs||[]).filter(x=>!x.read).length;return `<button class="bell" onclick="cBellClick()" title="Account requests">🔔${n?`<span>${n}</span>`:''}</button>`};
function cBellClick(){view='leads';(D.notifs||[]).forEach(n=>n.read=true);UNREAD=0;save();render();API('notifRead',{},TOK)}
/* two-step login */
function cSecure(){mdShow(`<h2 style="margin:0;font-family:Fraunces,serif">Secure my account</h2><p>Two-step login asks for a 6-digit code from your phone (Google Authenticator, Microsoft Authenticator or Authy) after your password.</p><p><b>Status:</b> ${MFAON?'ON':'OFF'}</p><div class="row"><button type="button" class="btn g" onclick="cm()">Close</button>${MFAON?(cur.role==='platform'?'':'<button type="button" class="btn d" onclick="cMfaOff()">Turn off</button>'):'<button type="button" class="btn" onclick="cMfa()">Turn on</button>'}</div>`)}
async function cMfa(forced){const r=await API('mfaEnrol',{},TOK);if(!r.secret){if(r.code===409){MFAON=true;return cSecure()}return alert(r.err||'Could not start.')}
 mdShow(`<h2 style="margin:0;font-family:Fraunces,serif">Turn on two-step login</h2><p>1. Open your authenticator app and scan this code, or type the key.</p><div id="qr" style="display:flex;justify-content:center;margin:8px 0;background:#fff;padding:8px;border-radius:8px;min-height:60px"></div><p style="font:600 14px monospace;word-break:break-all;text-align:center">${r.secret}</p><p>2. Enter the 6-digit code it shows:</p><input id="mc" inputmode="numeric" maxlength="6" placeholder="123456" style="font-size:20px;letter-spacing:4px;text-align:center"><div class="err" id="merr" style="color:#b3392f"></div><div class="row">${forced?'':'<button type="button" class="btn g" onclick="cm()">Cancel</button>'}<button type="button" class="btn" onclick="cMfaOn()">Confirm</button></div>${forced?'<p class="empty">The platform owner account must use two-step login.</p>':''}`);
 try{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';s.onload=()=>{try{new QRCode($('qr'),{text:r.uri,width:170,height:170})}catch(e){}};document.head.appendChild(s)}catch(e){}}
async function cMfaOn(){const r=await API('mfaOn',{code:$('mc').value},TOK);if(!r.codes){$('merr').textContent=r.err||'Wrong code.';return}MFAON=true;
 mdShow(`<h2 style="margin:0;font-family:Fraunces,serif">Save your recovery codes</h2><p>Each code works once if you lose your phone. They are shown only now. Keep them somewhere safe.</p><pre style="font:700 15px monospace;background:var(--bg);padding:12px;border-radius:10px">${r.codes.join('\n')}</pre><div class="row"><button type="button" class="btn g" onclick="navigator.clipboard&&navigator.clipboard.writeText('${r.codes.join(' ')}');this.textContent='Copied ✓'">Copy</button><button type="button" class="btn" onclick="cm()">I have saved them</button></div>`)}
function cMfaOff(){form('Turn off two-step login',[{k:'p',l:'Your password',t:'password'}],v=>{(async()=>{const r=await API('mfaOff',{pw:v.p},TOK);if(r.ok){MFAON=false;toast('Two-step login is off')}else alert(r.err||'Could not turn off.')})()})}
/* ===== INSTALLABLE APP (PWA) ===== */
let dip=null;const isStd=()=>matchMedia('(display-mode:standalone)').matches||navigator.standalone;
const iosSafari=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
function instBtn(){let b=document.getElementById('inst');if(!b){b=document.createElement('button');b.id='inst';b.textContent='⬇ Install app';b.onclick=doInstall;document.body.appendChild(b)}b.style.display=!isStd()&&(dip||iosSafari)?'block':'none'}
async function doInstall(){if(dip){dip.prompt();await dip.userChoice;dip=null;instBtn()}else if(iosSafari)alert('To install on iPhone or iPad:\n\n1. Tap the Share button in Safari\n2. Tap “Add to Home Screen”\n3. Tap Add')}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;instBtn()});addEventListener('appinstalled',()=>{dip=null;instBtn()});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
instBtn();
cBoot();
</script></body></html>
