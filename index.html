/* carousel: auto-moves, pauses on touch/hover, respects reduced motion */
let pvT=0,pvHold=false;
const pvStep=()=>{const k=$('pvk'),c=k&&k.firstElementChild;return c?c.getBoundingClientRect().width+parseFloat(getComputedStyle(k).columnGap||18):0};
function pvDots(){const k=$('pvk'),d=$('pvd');if(!k||!d)return;const st=pvStep()||1,i=Math.round(k.scrollLeft/st);[...d.children].forEach((x,j)=>x.className=j===i?'on':'')}
function privTo(i){const k=$('pvk');if(k)k.scrollTo({left:i*pvStep(),behavior:'smooth'})}
function privGo(n){const k=$('pvk');if(!k)return;const st=pvStep(),max=k.scrollWidth-k.clientWidth;let x=k.scrollLeft+n*st;if(x>max+4)x=0;if(x<-4)x=max;k.scrollTo({left:x,behavior:'smooth'})}
function privBind(){clearInterval(pvT);const k=$('pvk');if(!k)return;k.onscroll=pvDots;pvDots();
 const hold=v=>()=>{pvHold=v},sec=$('privacy');['mouseenter','focusin','touchstart'].forEach(e=>sec.addEventListener(e,hold(true),{passive:true}));['mouseleave','focusout','touchend'].forEach(e=>sec.addEventListener(e,()=>{setTimeout(()=>{pvHold=false},2500)},{passive:true}));
 if(!matchMedia('(prefers-reduced-motion:reduce)').matches)pvT=setInterval(()=>{if(!pvHold&&document.getElementById('pvk')&&!document.hidden)privGo(1)},3800)}
function faqSec(){
 const F=[['What is DK SPA POS?','A booking, sales and management system for barbershops, salons and spas: bookings, point of sale, M-Pesa, staff commission, stock, expenses and reports.','DK SPA POS ni nini?','Mfumo wa miadi, mauzo na usimamizi wa vinyozi, saluni na spa: miadi, mauzo, M-Pesa, kamisheni ya wafanyakazi, bidhaa, gharama na ripoti.'],
 ['Who is it for?','Owners and teams of barbershops, hair salons, braiding studios, spas and massage rooms. Every person on your team gets their own login.','Ni kwa nani?','Wamiliki na timu za vinyozi, saluni, studio za kusuka nywele, spa na vyumba vya masaji. Kila mtu kwenye timu yako anapata nenosiri lake.'],
 ['How do I get started?','Try the demo first. Then choose Create account on the login page. DK Global Tech reviews your request, shares the agreement and activates your account.','Naanzaje?','Jaribu demo kwanza. Kisha bonyeza Create account kwenye ukurasa wa kuingia. DK Global Tech itakagua ombi lako, kukutumia makubaliano na kuwasha akaunti yako.'],
 ['How much does it cost?','A once-off setup fee and a monthly subscription, agreed with DK Global Tech and written in your agreement. WhatsApp us for the current rates.','Gharama ni kiasi gani?','Ada ya kuanzisha mara moja na malipo ya kila mwezi, yanayokubaliwa na DK Global Tech na kuandikwa kwenye makubaliano yako. Tuandikie WhatsApp kwa bei za sasa.'],
 ['Can I take M-Pesa payments?','Yes. Cash, M-Pesa and card are recorded at the counter, and DK Global Tech sets up your M-Pesa Daraja details. Always confirm the M-Pesa message before you record a payment.','Naweza kupokea malipo ya M-Pesa?','Ndiyo. Pesa taslimu, M-Pesa na kadi hurekodiwa kaunta, na DK Global Tech inaweka mipangilio yako ya M-Pesa Daraja. Thibitisha ujumbe wa M-Pesa kila mara kabla ya kurekodi malipo.'],
 ['Where is my data kept and who can see it?','Each spa has its own separate data space, kept in the browser of the device you sign in on, so download a data file often as a backup. Only your own team can see it, according to the rights your manager gives. DK Global Tech cannot edit it.','Data yangu inahifadhiwa wapi na nani anaiona?','Kila spa ina nafasi yake ya data, inayohifadhiwa kwenye kivinjari cha kifaa unachoingia nacho, kwa hiyo pakua faili ya data mara kwa mara kama nakala rudufu. Ni timu yako tu inayoiona, kulingana na haki alizotoa meneja. DK Global Tech haiwezi kuihariri.'],
 ['What if I forget my password?','Staff request a one-time code (OTP) that the manager sees and passes on. Managers contact DK Global Tech by WhatsApp or email. Passwords are never sent by email.','Nikisahau nenosiri?','Wafanyakazi huomba msimbo wa mara moja (OTP) ambao meneja huuona na kuwapa. Mameneja wanawasiliana na DK Global Tech kwa WhatsApp au barua pepe. Manenosiri hayatumwi kwa barua pepe.'],
 ['Can my staff see everything?','No. Your manager chooses what each person can open, such as bookings only, sales, reports or price changes.','Wafanyakazi wangu wanaona kila kitu?','Hapana. Meneja wako anachagua kila mtu anaweza kufungua nini, kama miadi pekee, mauzo, ripoti au kubadilisha bei.'],
 ['Do you issue receipts and invoices?','Yes. Receipts and invoices can be printed or saved as PDF in 58mm, 80mm, A5 or A4, with your business details, and your KRA PIN and VAT if you want them.','Mnatoa risiti na ankara?','Ndiyo. Risiti na ankara zinaweza kuchapishwa au kuhifadhiwa kama PDF kwa ukubwa wa 58mm, 80mm, A5 au A4, zikiwa na maelezo ya biashara yako, na PIN ya KRA na VAT ukitaka.'],
 ['Does it work in Kiswahili?','Yes. Use the language box at the top of the page to switch between English and Kiswahili.','Inafanya kazi kwa Kiswahili?','Ndiyo. Tumia kisanduku cha lugha juu ya ukurasa kubadilisha kati ya Kiingereza na Kiswahili.'],
 ['What happens if I miss a monthly payment?','After the due date there is a grace period. If it ends without payment the team is locked out, but your data stays safe. Pay and message us on WhatsApp to reactivate.','Nikichelewa kulipa mwezi?','Baada ya tarehe ya malipo kuna muda wa nyongeza. Usipolipa katika muda huo timu inazuiwa kuingia, lakini data yako inabaki salama. Lipa na utuandikie WhatsApp ili kuwashwa upya.'],
 ['Who adds the photos and videos on this website?','Only the DK Global Tech platform admin, from the Media tab in the admin console. They are stored separately from all client data.','Nani anaweka picha na video kwenye tovuti hii?','Ni msimamizi wa jukwaa wa DK Global Tech pekee, kupitia kichupo cha Media kwenye paneli ya msimamizi. Huhifadhiwa tofauti na data zote za wateja.']];
 return `<section class="sec" id="faq"><h2>${LT('Frequently asked questions','Maswali yanayoulizwa mara kwa mara')}</h2><p>${LT('Quick answers about DK SPA POS.','Majibu mafupi kuhusu DK SPA POS.')}</p><div class="fqs">${F.map(f=>`<details class="fq"><summary>${LT(f[0],f[2])}</summary><p>${LT(f[1],f[3])}</p></details>`).join('')}</div><p style="margin-top:18px">${LT('Still have a question?','Bado una swali?')} <a style="color:#7fe0a6" target="_blank" rel="noopener" href="${waAsk('Hello DK Global Tech, I have a question about DK SPA POS.')}">${LT('Ask us on WhatsApp','Tuulize WhatsApp')}</a></p></section>`}

/* ---------- Media library (separate store) ---------- */
let MEDIA=[],MREM=[],mFirst=true;
const mRec=x=>{const r={...x};delete r.url;return r};
const mSafe=x=>x.id+'-'+String(x.name||'file').replace(/[^\w.-]+/g,'-');
const mYt=u=>{const m=/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/.exec(String(u||''));return m?m[1]:''};
const mOk=s=>/^(media\/|https:\/\/)[^\s"'<>]+$/.test(String(s||''));
function mOpen(){return new Promise((ok,no)=>{try{const r=indexedDB.open('dkspa_media',1);r.onupgradeneeded=()=>r.result.createObjectStore('items',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}})}
async function mTx(mode,fn){const db=await mOpen();return new Promise((ok,no)=>{const tx=db.transaction('items',mode),q=fn(tx.objectStore('items'));tx.oncomplete=()=>{db.close();ok(q&&q.result)};tx.onerror=tx.onabort=()=>{db.close();no(tx.error||new Error('Storage error'))}})}
async function mLoad(skipRemote){
 MEDIA.forEach(x=>{if(x.url)URL.revokeObjectURL(x.url)});
 try{const a=await mTx('readonly',s=>s.getAll());MEDIA=(a||[]).sort((x,y)=>x.at-y.at).map(x=>({...x,url:x.blob?URL.createObjectURL(x.blob):''}))}catch(e){MEDIA=[]}
 if(!skipRemote){try{const r=await fetch('media/manifest.json',{cache:'no-cache'});if(r.ok){const j=await r.json();MREM=(Array.isArray(j)?j:(j.items||[])).filter(x=>x&&(x.type==='youtube'?/^[\w-]{11}$/.test(x.id||''):mOk(x.src)))}}catch(e){MREM=[]}}
 mRefresh()}
function mRefresh(){if(cur&&cur.role==='platform'){if(view==='pmed')render()}else if(!cur&&scr==='land'&&mFirst)render();mFirst=false}
const mShrink=f=>new Promise(ok=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,1400/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>ok(b),'image/jpeg',.82)};i.onerror=()=>{URL.revokeObjectURL(u);ok(null)};i.src=u});
const mMsg=t=>{const e=$('mst');if(e)e.textContent=t};
async function mAdd(files){
 if(!cur||cur.role!=='platform')return;
 const cap=(($('mcap')||{}).value||'').trim(),bad=[];let n=0;
 for(const f of [...files]){
  const vid=/^video\//.test(f.type),img=/^image\//.test(f.type);
  if(!vid&&!img){bad.push(f.name+': not a photo or video');continue}
  if(vid&&f.size>80e6){bad.push(f.name+': video is over 80 MB');continue}
  mMsg('Saving '+f.name+'…');
  let blob=f,name=f.name;
  if(img&&!/gif|svg/.test(f.type)){const b=await mShrink(f);if(b){blob=b;name=name.replace(/\.[^.]+$/,'')+'.jpg'}}
  try{await mTx('readwrite',s=>s.put({id:U(),kind:vid?'video':'image',name,cap,type:blob.type||f.type,size:blob.size,show:1,at:Date.now()+n,blob}));n++}catch(e){bad.push(name+': could not be saved (storage may be full)')}}
 if(n){lg('Media added: '+n+' file(s)');save()}
 await mLoad(true);mMsg((n?n+' file(s) added. ':'')+bad.join(' · '))}
async function mAddYt(){const id=mYt(($('myt')||{}).value),cap=(($('mcap')||{}).value||'').trim();if(!id)return mMsg('Paste a valid YouTube link.');
 try{await mTx('readwrite',s=>s.put({id:U(),kind:'youtube',yt:id,name:'youtube-'+id,cap,show:1,at:Date.now()}));lg('YouTube video added');save();await mLoad(true);mMsg('YouTube video added.')}catch(e){mMsg('Could not save.')}}
async function mPut(id,fn){const x=MEDIA.find(m=>m.id===id);if(!x)return;const r=mRec(x);fn(r);try{await mTx('readwrite',s=>s.put(r))}catch(e){mMsg('Could not save.')}await mLoad(true)}
const mToggle=id=>mPut(id,r=>{r.show=r.show===0?1:0});
function mCapEd(id){const x=MEDIA.find(m=>m.id===id);if(!x)return;const v=prompt('Caption (shown under the photo or video):',x.cap||'');if(v===null)return;mPut(id,r=>{r.cap=v.trim()})}
async function mDel(id){const x=MEDIA.find(m=>m.id===id);if(!x||!confirm('Delete this '+(x.kind==='youtube'?'video link':x.kind)+' from the website? Client data is not affected.'))return;try{await mTx('readwrite',s=>s.delete(id));lg('Media deleted');save()}catch(e){}await mLoad(true)}
function mDl(url,name){const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()}
const mDlOne=id=>{const x=MEDIA.find(m=>m.id===id);if(x&&x.url)mDl(x.url,mSafe(x))};
function mDlAll(){MEDIA.filter(x=>x.url).forEach((x,i)=>setTimeout(()=>mDl(x.url,mSafe(x)),i*500))}
function mDlManifest(){const have=new Set(MREM.map(x=>x.type==='youtube'?'yt:'+x.id:String(x.src).split('/').pop())),items=MREM.slice();
 MEDIA.filter(x=>x.show!==0).forEach(x=>{if(x.kind==='youtube'){if(!have.has('yt:'+x.yt))items.push({type:'youtube',id:x.yt,cap:x.cap||''})}else if(!have.has(mSafe(x)))items.push({type:x.kind,src:'media/'+mSafe(x),cap:x.cap||''})});
 mDl(URL.createObjectURL(new Blob([JSON.stringify(items,null,2)],{type:'application/json'})),'manifest.json')}

function gal(){
 const seen=new Set(MREM.map(x=>x.type==='youtube'?'yt:'+x.id:String(x.src).split('/').pop()));
 const L=MREM.map(x=>({k:x.type==='video'?'video':x.type==='youtube'?'youtube':'image',u:x.src,c:x.cap||'',y:x.id})).concat(MEDIA.filter(x=>x.show!==0&&!seen.has(x.kind==='youtube'?'yt:'+x.yt:mSafe(x))).map(x=>({k:x.kind,u:x.url,c:x.cap||'',y:x.yt})));
 if(!L.length)return '';
 return `<section class="sec" id="gallery"><h2>${LT('Gallery','Picha na video')}</h2><div class="cards gl">${L.map(x=>`<div class="cd">${x.k==='youtube'?`<iframe src="https://www.youtube-nocookie.com/embed/${esc(x.y)}" title="${esc(x.c||'Video')}" loading="lazy" allowfullscreen style="width:100%;aspect-ratio:16/9;border:0;border-radius:10px"></iframe>`:x.k==='video'?`<video controls preload="metadata" playsinline src="${esc(x.u)}" style="width:100%;border-radius:10px;background:#000"></video>`:`<img loading="lazy" src="${esc(x.u)}" alt="${esc(x.c)}" style="width:100%;border-radius:10px">`}${x.c?`<p style="margin-top:8px">${esc(x.c)}</p>`:''}</div>`).join('')}</div></section>`}

function pmedView(){
 const sz=b=>b>1e6?(b/1e6).toFixed(1)+' MB':Math.max(1,Math.round(b/1e3))+' KB';
 const th=x=>x.kind==='youtube'?`<img src="https://img.youtube.com/vi/${esc(x.yt)}/hqdefault.jpg" alt="" style="width:100%;border-radius:8px">`:x.kind==='video'?`<video muted preload="metadata" src="${x.url}#t=0.5" style="width:100%;border-radius:8px;background:#000"></video>`:`<img src="${x.url}" alt="" style="width:100%;border-radius:8px">`;
 return head('Media',`<label class="btn" style="display:inline-block;cursor:pointer">Upload photos / videos<input type="file" accept="image/*,video/*" multiple hidden onchange="mAdd(this.files);this.value=''"></label>`)+
 `<div class="pan"><h2>Website photos and videos</h2><p class="empty" style="padding:0 0 8px">Everything here is kept in its own media store. It is separate from every client’s data and from your lease records, so adding, hiding or deleting a photo or video can never change any spa’s sales, clients, staff or prices. Photos are resized automatically; videos can be up to 80 MB.</p>
 <label>Caption for the next upload (optional)</label><input id="mcap" placeholder="e.g. Knotless braids, Nakuru">
 <label>Or add a YouTube video link</label><div class="tbar"><input id="myt" placeholder="https://youtu.be/…" style="flex:1;min-width:200px;width:auto"><button class="btn g" onclick="mAddYt()">Add link</button></div><div class="err" id="mst" style="color:var(--mu)"></div></div>
 <div class="pan"><h2>Library (${MEDIA.length})</h2><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px">${MEDIA.map(x=>`<div style="border:1px solid var(--bd);border-radius:10px;padding:8px">${th(x)}<div style="margin:6px 0 4px;font-size:13px;word-break:break-word">${esc(x.cap||x.name)}</div><div style="font-size:12px;color:var(--mu);margin-bottom:6px"><span class="bdg ${x.show===0?'bad':'ok'}">${x.show===0?'Hidden':'Visible'}</span> ${x.kind==='youtube'?'YouTube':x.kind==='video'?'Video':'Photo'}${x.size?' · '+sz(x.size):''}</div><div style="display:flex;gap:4px;flex-wrap:wrap"><button class="btn g s" onclick="mToggle('${x.id}')">${x.show===0?'Show':'Hide'}</button><button class="btn g s" onclick="mCapEd('${x.id}')">Caption</button>${x.url?`<button class="btn g s" onclick="mDlOne('${x.id}')">Download</button>`:''}<button class="btn d s" onclick="mDel('${x.id}')">Delete</button></div></div>`).join('')||'<div class="empty">No photos or videos yet. Use “Upload photos / videos”.</div>'}</div></div>
 <div class="pan rp"><h2>Show them to every visitor</h2><p class="empty" style="padding:0 0 8px">Uploads are saved in this browser, so visitors on other phones and computers will not see them until you publish them with the site. ${MREM.length?MREM.length+' item(s) are already published from media/manifest.json.':''}</p><p style="margin:0 0 10px">1. Press <b>Download all files</b> and put the files in a folder named <b>media</b> in your GitHub repository.<br>2. Press <b>Download manifest.json</b> and put it in the same <b>media</b> folder, replacing the old one.<br>3. Commit. The gallery then shows for everyone, and these uploads stay as your editing copy.</p><button class="btn" onclick="mDlAll()">Download all files</button> <button class="btn g" onclick="mDlManifest()">Download manifest.json</button></div>`}
Object.assign(V,{pmed:pmedView});

if(typeof SEC!=='undefined')V.psec=SEC.view;
SESS.restore();render();mLoad();if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));{const b=$('boot');if(b)b.remove()}
</script></body></html>
